name: Core POS checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: pos_test
          POSTGRES_PASSWORD: local-test-only
          POSTGRES_DB: pos_test
        ports: ["55439:5432"]
        options: >-
          --health-cmd "pg_isready -U pos_test -d pos_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://pos_test:local-test-only@127.0.0.1:55439/pos_test
      APP_ORIGIN: https://pos.example.invalid
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
      - run: npm run security:scan:test
      - run: npm run security:scan
      - run: npm run lint
      - run: npm run i18n:check
      - run: npm run release:claims:check
      - run: node scripts/release/check-data-flows.cjs
      - run: npm run typecheck
      - run: npm run worker:build
      - run: npm test
      - run: npm run test:ops
      - run: node scripts/ops/test-environment-isolation.mjs
        env:
          POS_ISOLATION_EVIDENCE: /tmp/pos-environment-isolation-ci.json
      - run: docker pull node:24-alpine
      - run: npm run test:pitr
        env:
          POS_PITR_NODE_IMAGE: node:24-alpine
      - run: npm run test:local-https
      - run: npm run test:integration
        env:
          POS_TEST_PSQL_CONTAINER: ${{ job.services.postgres.id }}
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:e2e
        env:
          POS_E2E_ALL_BROWSERS: '1'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: test-results/
          retention-days: 7
