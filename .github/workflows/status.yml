name: Independent status service
on:
  push:
    paths: ['ops/status/**', 'scripts/status/**', 'docker-compose.status.yml', '.github/workflows/status.yml']
  pull_request:
    paths: ['ops/status/**', 'scripts/status/**', 'docker-compose.status.yml', '.github/workflows/status.yml']
permissions:
  contents: read
jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test scripts/status/status.test.mjs
      - run: docker compose -f docker-compose.status.yml config --quiet
      - run: docker build -t localhost/pos-status:ops0206 ops/status
      - run: node scripts/status/drill.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: status-drill
          path: tasks/evidence/status186/*.json
