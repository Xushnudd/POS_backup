# Optional self-hosted PostgreSQL15 profile. Mount paths are internal contracts,
# not external services. Applied only with docker-compose.pitr.yml.
include = '/var/lib/postgresql/data/postgresql.conf'
wal_level = replica
full_page_writes = on
archive_mode = on
archive_timeout = 60s
archive_command = '/bin/sh /ops/pitr/archive-wal.sh "%p" "%f" /repository/archive'
