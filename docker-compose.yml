x-app-build: &app-build
  context: .
  args:
    NEXT_DEPLOYMENT_ID: ${POS_RELEASE:-}

services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pos_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be supplied securely}
      POSTGRES_DB: ${POSTGRES_DB:-pos_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    image: ${POS_IMAGE:-pos-app:local}
    build: *app-build
    profiles: ["migration"]
    command: ["node", "node_modules/prisma/build/index.js", "migrate", "deploy"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must point to the internal db service}
    depends_on:
      db:
        condition: service_healthy

  app:
    image: ${POS_IMAGE:-pos-app:local}
    build: *app-build
    restart: unless-stopped
    ports:
      - "${POS_BIND_ADDRESS:-127.0.0.1}:${POS_PORT:-3000}:3000"
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be supplied securely}
      APP_ORIGIN: ${APP_ORIGIN:?APP_ORIGIN must be the public HTTPS origin}
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: "0.0.0.0"
    init: true
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    depends_on:
      db:
        condition: service_healthy

  reconciliation:
    image: ${POS_IMAGE:-pos-app:local}
    build: *app-build
    profiles: ["monitoring"]
    command: ["node", "--require", "./scripts/worker-resolver.cjs", ".worker-build/scripts/workers/reconcile.js"]
    restart: unless-stopped
    init: true
    stop_grace_period: 35s
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must point to the internal db service}
      APP_ORIGIN: ${APP_ORIGIN:?APP_ORIGIN must be the public HTTPS origin}
      NODE_ENV: production
      RECONCILE_INTERVAL_MS: ${RECONCILE_INTERVAL_MS:-300000}
    depends_on:
      db:
        condition: service_healthy

  jobs:
    image: ${POS_IMAGE:-pos-app:local}
    build: *app-build
    profiles: ["jobs"]
    command: ["node", "--require", "./scripts/worker-resolver.cjs", ".worker-build/scripts/workers/jobs.js"]
    restart: unless-stopped
    init: true
    stop_grace_period: 35s
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must point to the internal db service}
      APP_ORIGIN: ${APP_ORIGIN:?APP_ORIGIN must be the public HTTPS origin}
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: {}
