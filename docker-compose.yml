version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: pos_db
    restart: always
    environment:
      POSTGRES_USER: pos_user
      POSTGRES_PASSWORD: pos_password
      POSTGRES_DB: pos_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pos_user -d pos_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pos_app
    restart: always
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "postgresql://pos_user:pos_password@db:5432/pos_db"
      JWT_SECRET: "change-this-in-production-min-32-chars!!"
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: "/api"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: {}
